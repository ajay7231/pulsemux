# Local development database only; does not start call workers or schedulers.
name: pulsemux-local
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: pulsemux
      POSTGRES_USER: pulsemux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the database env file}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pulsemux -d pulsemux']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
volumes:
  postgres-data:
