[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsemux-worker"
version = "0.1.0"
description = "PulseMux AI Intelligence & Orchestration Worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.62.0",
    "protobuf>=4.25.0",
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.7.0"
]
